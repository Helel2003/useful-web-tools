<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Useful Web Tools</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Useful Web Tools</h1>
    <p>Free browser tools • No login required</p>
  </header>

  <nav>
    <button onclick="showTool('password')">Password Generator</button>
    <button onclick="showTool('counter')">Word Counter</button>
    <button onclick="showTool('case')">Text Case</button>
    <button onclick="showTool('unit')">Unit Converter</button>
    <button onclick="showTool('json')">JSON Formatter</button>
  </nav>

  <main>
    <!-- Password Generator -->
    <section id="password" class="tool">
      <h2>Password Generator</h2>
      <div class="controls">
        <label>Length: <input type="number" id="passLength" value="16" min="4" max="64"></label>
        <label><input type="checkbox" id="passUpper" checked> Uppercase</label>
        <label><input type="checkbox" id="passLower" checked> Lowercase</label>
        <label><input type="checkbox" id="passNumbers" checked> Numbers</label>
        <label><input type="checkbox" id="passSymbols" checked> Symbols</label>
      </div>
      <button onclick="generatePassword()">Generate</button>
      <input type="text" id="passResult" readonly>
      <button onclick="copyText('passResult')">Copy</button>
    </section>

    <!-- Word Counter -->
    <section id="counter" class="tool" style="display:none">
      <h2>Word & Character Counter</h2>
      <textarea id="counterText" placeholder="Paste or type your text here..." rows="8"></textarea>
      <div class="stats">
        <p>Characters: <span id="charCount">0</span></p>
        <p>Words: <span id="wordCount">0</span></p>
        <p>Sentences: <span id="sentenceCount">0</span></p>
        <p>Paragraphs: <span id="paraCount">0</span></p>
      </div>
    </section>

    <!-- Text Case Converter -->
    <section id="case" class="tool" style="display:none">
      <h2>Text Case Converter</h2>
      <textarea id="caseText" placeholder="Type your text..." rows="6"></textarea>
      <div class="buttons">
        <button onclick="convertCase('upper')">UPPERCASE</button>
        <button onclick="convertCase('lower')">lowercase</button>
        <button onclick="convertCase('title')">Title Case</button>
        <button onclick="convertCase('sentence')">Sentence case</button>
      </div>
    </section>

    <!-- Unit Converter -->
    <section id="unit" class="tool" style="display:none">
      <h2>Unit Converter</h2>
      <select id="unitType" onchange="updateUnitOptions()">
        <option value="length">Length</option>
        <option value="weight">Weight</option>
        <option value="temp">Temperature</option>
      </select>
      <div class="unit-row">
        <input type="number" id="unitFrom" value="1" oninput="convertUnit()">
        <select id="unitFromUnit"></select>
      </div>
      <div class="unit-row">
        <input type="number" id="unitTo" readonly>
        <select id="unitToUnit"></select>
      </div>
    </section>

    <!-- JSON Formatter -->
    <section id="json" class="tool" style="display:none">
      <h2>JSON Formatter</h2>
      <textarea id="jsonInput" placeholder='{"example": "paste your JSON here"}' rows="8"></textarea>
      <button onclick="formatJSON()">Format</button>
      <button onclick="copyText('jsonOutput')">Copy Result</button>
      <pre id="jsonOutput"></pre>
    </section>
  </main>

  <footer>
    <p>Made for learning • <a href="https://github.com/Helel2003/useful-web-tools">GitHub</a></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
